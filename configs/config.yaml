experiment:
  name: "drug-discovery-tournament"
  target: "clinical_trial_phase_prediction"   # change to toxicity_risk_level or drug_likeness to switch targets

data:
  raw_path: "data/raw/drug_discovery_dataset.csv"
  processed_path: "data/processed/features.csv"
  test_size: 0.2
  random_state: 42

models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
  random_forest:
    n_estimators: 100
    max_depth: 10
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
  lightgbm:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
  svm:
    C: 1.0
    kernel: "rbf"
  knn:
    n_neighbors: 5
  gradient_boosting:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1

registry:
  model_name: "drug-trial-phase-classifier"
  promotion_metric: "f1_weighted"
  promotion_threshold: 0.0   # any model better than current Production gets promoted
