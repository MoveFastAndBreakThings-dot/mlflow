services:
  pipeline:
    build: .
    command: python pipeline.py
    volumes:
      - mlflow-data:/data
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////data/mlflow.db
    restart: "no"

  mlflow-ui:
    build: .
    command: mlflow ui --backend-store-uri sqlite:////data/mlflow.db --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/data
    restart: unless-stopped

volumes:
  mlflow-data:
